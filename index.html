<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- „Zum Home-Bildschirm hinzufuegen" auf iOS nimmt GENAU dieses Bild —
         eine SVG oder der Manifest-Eintrag reichen dort nicht. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Startwert; die Oberflaeche setzt ihn ab Phase 2 zur Laufzeit -->
    <meta name="theme-color" content="#1b1410" />
    <!-- Nach „Zum Home-Bildschirm hinzufuegen“ zeichnet die App bis unter die Statusleiste -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FixTheMix — Mischen und Sortieren</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
