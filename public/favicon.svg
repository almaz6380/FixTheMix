<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FixTheMix">
  <!-- Ein Glas mit rundem Boden und drei sauber getrennten Schichten — also
       genau das, was die App zeigt und was das Spiel verlangt.

       Bewusst SVG und nicht gezeichnetes Pixelwerk: das Symbol muss von
       16 Pixel (Browsertab) bis 1024 (App Store) dasselbe sein.

       Die Farben kommen aus dem Spiel, nicht aus der Luft: Nachtblau wie
       der Grundton `color-nacht`, die Schichten sind Zitrone, Erdbeere und Blaubeere aus
       src/engine/farben.ts, der Rand ist `color-glasrand`. Wer eine davon
       aendert, aendert sie dort — hier steht sie nur nach. -->
  <rect width="64" height="64" rx="14" fill="#0E1A2E"/>
  <g>
    <!-- Reagenzglas-Form: gerade Wand, halbrunder Boden. -->
    <path id="glasform" d="M22 12v30a10 10 0 0 0 20 0V12z" fill="#0A1220"/>
    <clipPath id="glas">
      <path d="M22 12v30a10 10 0 0 0 20 0V12z"/>
    </clipPath>
    <g clip-path="url(#glas)">
      <rect x="20" y="12" width="24" height="14" fill="#FFC93C"/>
      <rect x="20" y="26" width="24" height="14" fill="#FF4D6D"/>
      <rect x="20" y="40" width="24" height="16" fill="#3FA9F5"/>
      <!-- Die helle Kuppe an jeder Oberkante. Sie ist der Unterschied
           zwischen einem Farbstreifen und Fluessigkeit — dieselbe Idee wie
           in Glas.tsx, nur ohne Verlauf, damit es bei 16 Pixel nicht matscht. -->
      <rect x="20" y="12" width="24" height="2.5" fill="#FFDC7A"/>
      <rect x="20" y="26" width="24" height="2.5" fill="#FF7A93"/>
      <rect x="20" y="40" width="24" height="2.5" fill="#86CBFA"/>
    </g>
    <path d="M22 12v30a10 10 0 0 0 20 0V12"
          fill="none" stroke="#9BC4E8" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Die Oeffnung oben. Ohne sie steht da ein Balken, kein Glas. -->
    <ellipse cx="32" cy="12" rx="10" ry="3.4" fill="#0A1220" stroke="#BEDCF5" stroke-width="2.6"/>
  </g>
</svg>
