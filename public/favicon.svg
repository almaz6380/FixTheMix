<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FixTheMix">
  <!-- Bar-Glas mit zwei Schichten, die sich zur Mischfarbe treffen.
       Bewusst SVG und nicht gezeichnetes Pixelwerk: das Symbol muss von
       16 Pixel (Browsertab) bis 1024 (App Store) dasselbe sein. -->
  <rect width="64" height="64" rx="14" fill="#1b1410"/>
  <g>
    <path d="M20 14h24l-9 16v14h6a2 2 0 0 1 0 4H23a2 2 0 0 1 0-4h6V30z" fill="#0d0a08"/>
    <clipPath id="glas">
      <path d="M20 14h24l-9 16v14h6a2 2 0 0 1 0 4H23a2 2 0 0 1 0-4h6V30z"/>
    </clipPath>
    <g clip-path="url(#glas)">
      <rect x="18" y="14" width="28" height="9" fill="#facc15"/>
      <rect x="18" y="23" width="28" height="9" fill="#3b82f6"/>
      <rect x="18" y="32" width="28" height="20" fill="#22c55e"/>
    </g>
    <path d="M20 14h24l-9 16v14h6a2 2 0 0 1 0 4H23a2 2 0 0 1 0-4h6V30z"
          fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
